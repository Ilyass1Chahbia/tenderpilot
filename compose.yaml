services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tenderpilot
      POSTGRES_USER: tenderpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5

volumes:
  postgres_data: